<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight Pool Map</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#f5f6f8;color:#202124;font-size:13px}
.hdr{background:linear-gradient(135deg,#1a73e8,#0d47a1);color:#fff;padding:16px 20px}
.hdr h1{font-size:18px;font-weight:600}
.hdr p{font-size:11px;opacity:.8;margin-top:2px}
.bar{padding:10px 16px;background:#fff;border-bottom:1px solid #e0e0e0;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.g{display:flex;flex-direction:column;gap:2px}
.g label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#5f6368}
.g input,.g select{padding:5px 8px;border:1px solid #e0e0e0;border-radius:5px;font-size:12px;outline:none;background:#fff}
.g input:focus,.g select:focus{border-color:#1a73e8;box-shadow:0 0 0 2px #e8f0fe}
#destSearch{width:180px}
#airlineSearch{width:180px}
#destSel{width:140px}
.toggles label{font-size:11px;display:flex;align-items:center;gap:3px;cursor:pointer;font-weight:400;text-transform:none;letter-spacing:0}
.toggles input[type=checkbox]{accent-color:#1a73e8}
.wrap{padding:8px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
th{background:#f8f9fa;padding:7px 8px;font-weight:600;font-size:10px;text-align:center;border-bottom:2px solid #e0e0e0;white-space:nowrap}
th:first-child{text-align:left;min-width:100px}
th.ov{background:#e8f0fe}
tr{border-bottom:1px solid #f0f0f0}
tr.co{background:#f1f3f4;cursor:pointer}
tr.co:hover{background:#e8eaed}
tr.co td{padding:6px 8px;font-weight:600;font-size:11px}
tr.ci{background:#fff}
tr.ci:hover{background:#f8f9fa}
tr.ci td{padding:5px 8px}
tr.ci td:first-child{padding-left:28px}
.ex{display:inline-block;width:14px;font-size:8px;color:#5f6368;transition:transform .15s;text-align:center}
.ex.op{transform:rotate(90deg)}
.dn{display:inline-flex;align-items:center;gap:4px}
.tg{font-size:8px;padding:1px 3px;border-radius:2px;font-weight:600}
.tg.ct{background:#e3f2fd;color:#1565c0}
.tg.cy{background:#f3e5f5;color:#7b1fa2}
td.c{text-align:center;padding:5px 6px;vertical-align:middle}
.pk{display:inline-flex;align-items:center;justify-content:center;background:#e8f0fe;color:#1a73e8;padding:2px 6px;border-radius:9px;font-size:11px;font-weight:500;cursor:pointer;text-decoration:none;transition:all .12s;white-space:nowrap;min-width:38px;text-align:center}
.pk:hover{background:#1a73e8;color:#fff;transform:scale(1.05)}
.pk.na{background:transparent;color:#ddd;cursor:default;min-width:14px;font-size:9px}
.pk.na:hover{background:transparent;color:#ddd;transform:none}
.st{font-size:10px;color:#5f6368;padding:4px 16px}
.st b{color:#202124}
.clear-btn{font-size:10px;color:#1a73e8;cursor:pointer;margin-left:4px;text-decoration:underline}
.clear-btn:hover{color:#0d47a1}
</style>
</head>
<body>
<div class="hdr"><h1>✈️ Flight Pool Map</h1><p>Click Pool ID to open link · Right-click to copy ID</p></div>
<div class="bar">
  <div class="g"><label>Destination Search</label><input type="text" id="destSearch" placeholder="e.g. CN, BKK, TH..."><span class="clear-btn" id="clearDest">clear</span></div>
  <div class="g"><label>Airline Search</label><input type="text" id="airlineSearch" placeholder="e.g. SQ, AK, LH LX..."><span class="clear-btn" id="clearAir">clear</span></div>
  
  <div class="g toggles"><label>Toggle</label>
    <div style="display:flex;gap:6px">
      <label><input type="checkbox" id="togAll" checked> All class</label>
      <label><input type="checkbox" id="togFc"> Business &amp; First class</label>
    </div>
  </div>
  <div class="st" id="statsBar" style="margin-left:auto;align-self:center"></div>
</div>

var dests=D.destinations, al=D.airlines, col=D.columns;

var OV=[
  {k:'__all__',l:'All class',tid:'togAll',on:true},
  {k:'__fc__',l:'Business & First class',tid:'togFc',on:false}
];
var st={destQ:'',airQ:'',ex:{}};

dests.forEach(function(d){
  if(d.type==='country'){
    var hc=dests.some(function(dd){return dd.type==='city'&&dd.country===d.name});
    if(hc)st.ex[d.name]=true;
  }
});



OV.forEach(function(o){var e=document.getElementById(o.tid);if(e)e.checked=o.on});

function mU(k,p,dtype){
  var lk=k;
  if(k==='__all__'){
    lk=(dtype==='city')?'CITY POOL (all class)':'COUNTRY POOL (all class)';
  }else if(k==='__fc__'){
    lk='COUNTRY POOL (FC class)';
  }
  var info=col[lk];
  return info?info.urlTemplate.replace('{poolId}',p):null;
}

function gP(k,n){
  var d=null;
  for(var i=0;i<dests.length;i++){if(dests[i].name===n){d=dests[i];break}}
  if(!d)return null;
  if(k==='__all__'){return d.type==='city'?d.cityPool:(d.pools['COUNTRY POOL (all class)']||null)}
  if(k==='__fc__'){return d.pools['COUNTRY POOL (FC class)']||null}
  return d.pools[k]||null;
}

function toast(m){
  var t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:5px 14px;border-radius:14px;font-size:11px;z-index:9999';
  t.textContent=m;document.body.appendChild(t);
  setTimeout(function(){t.parentNode.removeChild(t)},1500);
}

function cp(e,p){e.preventDefault();e.stopPropagation();if(navigator.clipboard)navigator.clipboard.writeText(p).then(function(){toast('Copied: '+p)})}

function getCols(){
  var r=[],t=st.airQ.trim().toLowerCase();
  if(!t){
    OV.forEach(function(o){var e=document.getElementById(o.tid);if(e&&e.checked)r.push(o)});
    al.forEach(function(a){r.push({k:a,l:a})});
  }else{
    al.forEach(function(a){if(a.toLowerCase().indexOf(t)!==-1)r.push({k:a,l:a})});
  }
  return r;
}

function getCtrys(){
  var all=dests.filter(function(d){return d.type==='country'});
  var at=st.airQ.trim().toLowerCase();
  var dt=st.destQ.trim().toLowerCase();

  // Airline search: only show countries/cities that have data for matching airlines
  if(at){
    var matchingAirlines=al.filter(function(a){return a.toLowerCase().indexOf(at)!==-1});
    return all.filter(function(c){
      return matchingAirlines.some(function(a){return c.pools&&c.pools[a]}) ||
             dests.some(function(d){return d.type==='city'&&d.country===c.name&&matchingAirlines.some(function(a){return d.pools&&d.pools[a]})});
    });
  }

  if(!dt)return all;
  var ex=all.filter(function(c){return c.name.toLowerCase()===dt});
  if(ex.length)return ex;
  var pr=all.filter(function(c){return c.name.toLowerCase().indexOf(dt)===0});
  if(pr.length)return pr;
  var by=all.filter(function(c){return dests.some(function(d){return d.type==='city'&&d.country===c.name&&d.name.toLowerCase().indexOf(dt)===0})});
  if(by.length)return by;
  return all.filter(function(c){
    if(c.name.toLowerCase().indexOf(dt)!==-1)return true;
    return dests.some(function(d){return d.type==='city'&&d.country===c.name&&d.name.toLowerCase().indexOf(dt)!==-1});
  });
}

function render(){
  var sc=getCols(),sct=getCtrys();
  

  var thead=document.getElementById('tH');
  thead.innerHTML='';
  var hr=document.createElement('tr');
  var th0=document.createElement('th');th0.textContent='Destination';hr.appendChild(th0);
  sc.forEach(function(c){var th=document.createElement('th');th.textContent=c.l;if(c.tid)th.className='ov';hr.appendChild(th)});
  thead.appendChild(hr);

  var tbody=document.getElementById('tB');
  tbody.innerHTML='';
  var vn=0,pn=0,tl=st.destQ.trim().toLowerCase();

  sct.forEach(function(co){
    var cities=dests.filter(function(d){return d.type==='city'&&d.country===co.name});
    var hc=cities.length>0,ie=!!st.ex[co.name];
    var sc2=cities;
    if(tl){
      var cm=co.name.toLowerCase().indexOf(tl)!==-1;
      if(!cm)sc2=cities.filter(function(c){return c.name.toLowerCase().indexOf(tl)!==-1});
    }
    if(st.airQ.trim()){
      var matchingAl=al.filter(function(a){return a.toLowerCase().indexOf(st.airQ.trim().toLowerCase())!==-1});
      sc2=sc2.filter(function(c){return matchingAl.some(function(a){return c.pools&&c.pools[a]})});
    }

    var tr=document.createElement('tr');tr.className='co';
    var td=document.createElement('td');
    var h='<span class="dn">';
    h+=hc?'<span class="ex'+(ie?' op':'')+'">▶</span>':'<span style="width:14px;display:inline-block"></span>';
    h+='<b>'+co.name+'</b></span>';
    td.innerHTML=h;tr.appendChild(td);

    sc.forEach(function(c){
      var td2=document.createElement('td');td2.className='c';
      var pid=gP(c.k,co.name);
      if(pid){
        var url=mU(c.k,pid,'country');
        var a=document.createElement('a');a.className='pk';a.textContent=pid;
        if(url){a.href=url;a.target='_blank'}
        a.oncontextmenu=function(e){cp(e,pid)};
        td2.appendChild(a);pn++;
      }else{td2.innerHTML='<span class="pk na">—</span>'}
      tr.appendChild(td2);
    });

    (function(nm,hasC){
      tr.onclick=function(e){
        if(e.target.tagName==='A')return;
        if(!hasC)return;
        st.ex[nm]=!st.ex[nm];render();
      };
    })(co.name,hc);

    tbody.appendChild(tr);vn++;

    if(hc&&ie){
      sc2.forEach(function(ct){
        var tr2=document.createElement('tr');tr2.className='ci';
        var td3=document.createElement('td');
        td3.innerHTML='<span class="dn"><span style="width:14px;display:inline-block"></span>'+ct.name+'</span>';
        tr2.appendChild(td3);

        sc.forEach(function(c){
          var td4=document.createElement('td');td4.className='c';
          var pid=gP(c.k,ct.name);
          if(pid){
            var url=mU(c.k,pid,'city');
            var a=document.createElement('a');a.className='pk';a.textContent=pid;
            if(url){a.href=url;a.target='_blank'}
            a.oncontextmenu=function(e){cp(e,pid)};
            td4.appendChild(a);pn++;
          }else{td4.innerHTML='<span class="pk na">—</span>'}
          tr2.appendChild(td4);
        });

        tbody.appendChild(tr2);vn++;
      });
    }
  });

  document.getElementById('statsBar').innerHTML='<b>'+vn+'</b> dest · <b>'+pn+'</b> pools · <b>'+sc.length+'</b> cols';
}


document.getElementById('destSearch').oninput=function(e){st.destQ=e.target.value;render()};
document.getElementById('airlineSearch').oninput=function(e){st.airQ=e.target.value;render()};
document.getElementById('clearDest').onclick=function(){document.getElementById('destSearch').value='';st.destQ='';render()};
document.getElementById('clearAir').onclick=function(){document.getElementById('airlineSearch').value='';st.airQ='';render()};
document.getElementById('togAll').onchange=function(){render()};
document.getElementById('togFc').onchange=function(){render()};

render();
</script>
